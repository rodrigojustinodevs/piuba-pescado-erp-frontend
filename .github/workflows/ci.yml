name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    env:
      # Obrigatória em produção (o build falha sem ela); aqui é só um valor de CI.
      API_URL: http://localhost:8005
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E (sem backend)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
