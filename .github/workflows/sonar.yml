name: SonarCloud Analysis
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para uma análise melhor do Sonar

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9 # Versão recomendada para Node 20

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # A action sonarcloud-github-action foi descontinuada; a sonarqube-scan-action é o replacement direto.
      - name: Sonar Scan
        # v5.0.0 (pinned): https://github.com/SonarSource/sonarqube-scan-action/releases/tag/v5.0.0
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || github.event.repository.name }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Gerado automaticamente pelo GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # O segredo que você criou manualmente